          ║     • RTL8188EUS (TL-WN722N V4) attempt             ║
          ╚═════════════════════════════════════════════════════╝
          Installing XStock Kernel...
          EOF

          ZIP_NAME="AK3_XStock-AIO-FULL_NOKSU_$(date +'%Y-%m-%d').zip"
          cd AnyKernel3
          zip -r9 "../$ZIP_NAME" * -x .git/*
          cd ..
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: "⬆️ Upload to GitHub Release"
