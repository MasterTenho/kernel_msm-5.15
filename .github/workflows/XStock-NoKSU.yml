          ║     • Metamodule & NoMount Support                  ║
          ║     • memtool (static, CONFIG_DEVMEM)               ║
          ║     • NFC + Bluetooth support                       ║
          ║     • DNS Resolver                                  ║
          ║     • Infrared (IR) support                         ║
          ║     • FastCharge (USB force fast charge)            ║
