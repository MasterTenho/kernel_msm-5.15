name: "Build XStock-NoKSU"

env:
  OUT_DIR: "out"
  KERNEL_VERSION: "5.15"
  ANDROID_VERSION: "13"

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernels:
    name: "🐎 Build XStock ${{ matrix.kernel.name }} kernel"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kernel:
          - name: "GKI-NoKSU"
            dir: "common_gki_noksu"
            repo_name: "common"
            repo_url: "https://android.googlesource.com/kernel/common"
            branch: "android13-5.15-lts"
            defconfig: "gki_defconfig"
            local_version: "-XStock-GKI"
            output_name: "Image.gki.noksu"
            enable_ksu: false
            extra_patches:
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-gki-fixup.patch"
              - "https://raw.githubusercontent.com/yougotme101/kernel_patches/main/0001-scripts-sign-builds.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-Don-t-append-and-dirty-to-localversion.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-do-not-ship-full-auto_localversion.patch"

    env:
      KERNEL_LOC_DIR: ${{ matrix.kernel.dir }}
      KERNEL_NAME: ${{ matrix.kernel.repo_name }}
      KERNEL_REPO: ${{ matrix.kernel.repo_url }}
      KERNEL_BRANCH: ${{ matrix.kernel.branch }}
      DEFCONFIG_NAME: ${{ matrix.kernel.defconfig }}
      LOCAL_VERSION: ${{ matrix.kernel.local_version }}
      OUTPUT_NAME: ${{ matrix.kernel.output_name }}
      WORK_DIR: ${{ github.workspace }}

    steps:
      - name: "✨ Setup workspace"
        run: |
          mkdir -p ${{ env.KERNEL_LOC_DIR }}
          echo "BUILD_TIME=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          sudo apt-get update -qq
          sudo apt-get install -y repo rsync aria2 jq gcc-aarch64-linux-gnu autoconf automake

      - name: 🔍 Check Space (Before Cleanup)
        run: df -h /

      - name: 🧹 Aggressive Cleanup
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force
          sudo docker builder prune -a -f

      - name: 📐 Setup SWAP 14GB
        uses: pierotofy/set-swap-space@master
        with:
            swap-size-gb: 14

      - name: 📐 Tune Swap
        run: |
            echo "vm.swappiness=80" | sudo tee -a /etc/sysctl.conf
            sudo sysctl -p

      - name: "🌟 Clone kernel source"
        working-directory: ./${{ env.KERNEL_LOC_DIR }}
        run: |
          git clone --recursive --branch ${{ env.KERNEL_BRANCH }} \
            ${{ env.KERNEL_REPO }} ${{ env.KERNEL_NAME }} --depth=1

      - name: "📥 Initialize AOSP repo and toolchains"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15-lts --depth=1
          repo sync --optimized-fetch --prune -j8

          rm -rf .repo common

          aria2c -x 16 -s 16 -o prebuilts/clang/host/linux-x86/clang-r614150.tar.gz "https://github.com/yougotme101/clang/releases/download/v1.0.2/clang-r614150.tar.gz"
          mkdir -p prebuilts/clang/host/linux-x86/clang-r614150
          tar -xzf prebuilts/clang/host/linux-x86/clang-r614150.tar.gz -C prebuilts/clang/host/linux-x86/clang-r614150
          rm -rf prebuilts/clang/host/linux-x86/clang-r614150.tar.gz

          rm -rf prebuilts/clang/host/linux-x86/clang-3289846 \
                 prebuilts/clang/host/linux-x86/clang-r450784e \
                 prebuilts/clang/host/linux-x86/clang-r547379 \
                 prebuilts/clang/host/linux-x86/clang-r584948b \
                 prebuilts/clang/host/linux-x86/clang-r596125 \
                 prebuilts/clang/host/linux-x86/clang-stable

          sed -i \
           -e 's/^BRANCH=.*/BRANCH=android13-5.15/' \
           -e 's/^CLANG_VERSION=.*/CLANG_VERSION=r614150/' \
           ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.constants

          sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki || true

      - name: "🧩 Configure kernel & patches"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          echo "CONFIG_LOCALVERSION=\"${{ env.LOCAL_VERSION }}-${{ env.BUILD_TIME }}\"" >> "$CONFIG_FILE"
          echo "CONFIG_LOCALVERSION_AUTO=n" >> "$CONFIG_FILE"

          apply_patch() {
            local url="$1"
            local file=$(basename "$url")
            curl -L -o "$file" "$url"
            patch -p1 < "$file" || echo "::warning::Hunks failed in $file"
            rm -f "$file"
          }

          apply_patch "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-gki-fixup.patch"

          echo '${{ toJSON(matrix.kernel.extra_patches) }}' | jq -r '.[]' | while read p; do
            [ -n "$p" ] && apply_patch "$p"
          done

          echo "CONFIG_KALLSYMS=y" >> "$CONFIG_FILE"

          # Optimizaciones base
          echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" >> "$CONFIG_FILE"
          echo "CONFIG_TCP_CONG_ADVANCED=y" >> "$CONFIG_FILE"
          echo "CONFIG_TCP_CONG_BIC=n" >> "$CONFIG_FILE"
          echo "CONFIG_TCP_CONG_WESTWOOD=y" >> "$CONFIG_FILE"
          echo "CONFIG_TCP_CONG_HTCP=n" >> "$CONFIG_FILE"
          echo "CONFIG_TCP_CONG_BBR=y" >> "$CONFIG_FILE"
          echo "CONFIG_DEFAULT_BBR=y" >> "$CONFIG_FILE"
          echo "CONFIG_OVERLAY_FS=y" >> "$CONFIG_FILE"
          echo "CONFIG_TMPFS_XATTR=y" >> "$CONFIG_FILE"
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> "$CONFIG_FILE"
          echo "CONFIG_WQ_POWER_EFFICIENT_DEFAULT=y" >> "$CONFIG_FILE"
          echo "CONFIG_PM_WAKELOCKS=y" >> "$CONFIG_FILE"
          echo "CONFIG_PM_WAKELOCKS_LIMIT=100" >> "$CONFIG_FILE"
          echo "CONFIG_PM_WAKELOCKS_GC=y" >> "$CONFIG_FILE"
          echo "CONFIG_SUSPEND=y" >> "$CONFIG_FILE"
          echo "CONFIG_SUSPEND_FREEZER=y" >> "$CONFIG_FILE"
          echo "# CONFIG_KERNEL_GZIP is not set" >> "$CONFIG_FILE"
          echo "# CONFIG_KERNEL_LZO is not set" >> "$CONFIG_FILE"
          echo "# CONFIG_KERNEL_XZ is not set" >> "$CONFIG_FILE"
          echo "# CONFIG_KERNEL_ZSTD is not set" >> "$CONFIG_FILE"
          echo "# CONFIG_KERNEL_BZIP2 is not set" >> "$CONFIG_FILE"
          echo "# CONFIG_KERNEL_UNCOMPRESSED is not set" >> "$CONFIG_FILE"
          sed -i '/ZRAM_DEF_COMP_LZO/d' "$CONFIG_FILE"
          echo "CONFIG_CRYPTO_LZ4=y" >> "$CONFIG_FILE"
          echo "CONFIG_KERNEL_LZ4=y" >> "$CONFIG_FILE"
          echo "ZRAM_DEF_COMP_LZ4=y" >> "$CONFIG_FILE"

          # NFC
          echo "CONFIG_NFC=y" >> "$CONFIG_FILE"

          # Bluetooth
          grep -q "^CONFIG_BT=y" "$CONFIG_FILE" || echo "CONFIG_BT=y" >> "$CONFIG_FILE"
          grep -q "^CONFIG_BT_HIDP=y" "$CONFIG_FILE" || echo "CONFIG_BT_HIDP=y" >> "$CONFIG_FILE"

          # DNS Resolver
          echo "CONFIG_DNS_RESOLVER=y" >> "$CONFIG_FILE"

          # Infrarrojos (IR)
          echo "CONFIG_RC_CORE=y" >> "$CONFIG_FILE"
          echo "CONFIG_LIRC=y" >> "$CONFIG_FILE"
          echo "CONFIG_BPF_LIRC_MODE2=y" >> "$CONFIG_FILE"
          echo "CONFIG_RC_DECODERS=y" >> "$CONFIG_FILE"
          echo "CONFIG_RC_DEVICES=y" >> "$CONFIG_FILE"

          # memtool: habilita /dev/mem
          echo "CONFIG_DEVMEM=y" >> "$CONFIG_FILE"
          echo "# CONFIG_STRICT_DEVMEM is not set" >> "$CONFIG_FILE"
          echo "# CONFIG_IO_STRICT_DEVMEM is not set" >> "$CONFIG_FILE"

          # FastCharge (para carga por USB)
          echo "CONFIG_FORCE_FAST_CHARGE=y" >> "$CONFIG_FILE"

      - name: "🔧 Integrate MemKernel (LKM) + GKI module list"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          set -euo pipefail
          echo "📦 Integrating MemKernel as loadable module with fixed name..."
          curl -LSs "https://raw.githubusercontent.com/Poko-Apps/MemKernel/main/kernel/setup.sh" | bash -s M memk || {
            echo "::warning::MemKernel setup failed"
            exit 0
          }

          MEMK_ENTRY="drivers/memkernel/memk_memk.ko"
          echo "🔍 Expected MemKernel module: $MEMK_ENTRY"
          MODULES_LIST="android/gki_aarch64_modules"
          if [ -f "$MODULES_LIST" ] && ! grep -q "$MEMK_ENTRY" "$MODULES_LIST"; then
            echo "$MEMK_ENTRY" >> "$MODULES_LIST"
            echo "✅ MemKernel agregado a gki_aarch64_modules"
          fi

          echo "✅ MemKernel integrated"

      - name: '⚙️ Inject Reflex Governor'
        shell: bash
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          set -euo pipefail
          mkdir -p kernel/sched
          curl -sL -o kernel/sched/cpufreq_reflex.c \
            "https://raw.githubusercontent.com/kusonekoworld-max/KonekoKernel-GKI/refs/heads/main/.github/actions/build-kernel/patches/reflex/cpufreq_reflex.c"

          if ! grep -q "cpufreq_reflex.o" "kernel/sched/Makefile"; then
            echo 'obj-$(CONFIG_CPU_FREQ_GOV_REFLEX) += cpufreq_reflex.o' >> "kernel/sched/Makefile"
          fi

          if ! grep -q "config CPU_FREQ_GOV_REFLEX" "drivers/cpufreq/Kconfig"; then
            printf "\nconfig CPU_FREQ_GOV_REFLEX\n" >> "drivers/cpufreq/Kconfig"
            printf "\ttristate \"'reflex' cpufreq governor\"\n" >> "drivers/cpufreq/Kconfig"
            printf "\tdepends on CPU_FREQ && SMP\n" >> "drivers/cpufreq/Kconfig"
            printf "\tselect CPU_FREQ_GOV_ATTR_SET\n" >> "drivers/cpufreq/Kconfig"
            printf "\thelp\n" >> "drivers/cpufreq/Kconfig"
            printf "\t  'reflex' is an advanced CPU frequency governor based on schedutil.\n" >> "drivers/cpufreq/Kconfig"
          fi

          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          if [ -f "$CONFIG_FILE" ] && ! grep -q "CONFIG_CPU_FREQ_GOV_REFLEX" "$CONFIG_FILE"; then
            echo "CONFIG_CPU_FREQ_GOV_REFLEX=y" >> "$CONFIG_FILE"
          fi

      - name: 'Inject Vorpal Governor + GKI510 Compat'
        shell: bash
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          set -euo pipefail
          mkdir -p kernel/sched
          curl -sL -o kernel/sched/cpufreq_vorpal.c \
            "https://raw.githubusercontent.com/yougotme101/KonekoKernel-GKI/refs/heads/main/.github/actions/build-kernel/patches/vorpal/cpufreq_vorpal.c"
          curl -sL -o kernel/sched/rfx_gki510_compat.c \
            "https://raw.githubusercontent.com/yougotme101/KonekoKernel-GKI/refs/heads/main/.github/actions/build-kernel/patches/vorpal/rfx_gki510_compat.c"

          if ! grep -q "cpufreq_vorpal.o" "kernel/sched/Makefile"; then
            echo 'obj-$(CONFIG_CPU_FREQ_GOV_VORPAL) += cpufreq_vorpal.o' >> "kernel/sched/Makefile"
          fi
          if ! grep -q "rfx_gki510_compat.o" "kernel/sched/Makefile"; then
            echo 'obj-y += rfx_gki510_compat.o' >> "kernel/sched/Makefile"
          fi

          if ! grep -q "config CPU_FREQ_GOV_VORPAL" "drivers/cpufreq/Kconfig"; then
            printf "\nconfig CPU_FREQ_GOV_VORPAL\n" >> "drivers/cpufreq/Kconfig"
            printf "\ttristate \"'vorpal' cpufreq governor\"\n" >> "drivers/cpufreq/Kconfig"
            printf "\tdepends on CPU_FREQ && SMP\n" >> "drivers/cpufreq/Kconfig"
            printf "\tselect CPU_FREQ_GOV_ATTR_SET\n" >> "drivers/cpufreq/Kconfig"
            printf "\thelp\n" >> "drivers/cpufreq/Kconfig"
            printf "\t  'vorpal' is a schedutil-based governor tuned for gaming.\n" >> "drivers/cpufreq/Kconfig"
          fi

          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          if [ -f "$CONFIG_FILE" ] && ! grep -q "CONFIG_CPU_FREQ_GOV_VORPAL" "$CONFIG_FILE"; then
            echo "CONFIG_CPU_FREQ_GOV_VORPAL=y" >> "$CONFIG_FILE"
          fi

      - name: 'Fix Vorpal Input-Handler Init Bug'
        shell: bash
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          set -euo pipefail
          VORPAL_C="kernel/sched/cpufreq_vorpal.c"
          if ! grep -q "bool input_ok;" "$VORPAL_C"; then
           perl -0pi -e 's{(static int __init vorpal_gov_init\(void\)\n\{\n\tint ret;\n)}{$1\tbool input_ok;\n}' "$VORPAL_C"
          fi
          if ! grep -q "input_ok = !input_register_handler" "$VORPAL_C"; then
            perl -0pi -e 's{\tif \(input_register_handler\(&rfx_input_handler\)\)\n\t\tpr_warn\("vorpal: input handler register failed \(touch boost off\)\\n"\);}{\tinput_ok = !input_register_handler(&rfx_input_handler);\n\tif (!input_ok)\n\t\tpr_warn("vorpal: input handler register failed (touch boost off)\\n");}' "$VORPAL_C"
          fi
          if ! grep -q "if (input_ok)" "$VORPAL_C"; then
            perl -0pi -e 's{\tret = cpufreq_register_governor\(&vorpal_gov\);\n\tif \(ret\) \{\n\t\tinput_unregister_handler\(&rfx_input_handler\);\n\t\tcancel_delayed_work_sync\(&rfx_thermal_work\);\n\t\}}{\tret = cpufreq_register_governor(&vorpal_gov);\n\tif (ret) \{\n\t\tif (input_ok)\n\t\t\tinput_unregister_handler(&rfx_input_handler);\n\t\tcancel_delayed_work_sync(&rfx_thermal_work);\n\t\}}' "$VORPAL_C"
          fi
          for MARK in "bool input_ok;" "input_ok = !input_register_handler" "if (input_ok)"; do
            if ! grep -qF "$MARK" "$VORPAL_C"; then
              echo "ERROR: missing marker in vorpal_gov_init(): $MARK" >&2
              exit 1
            fi
          done

      - name: 'Inject Vorpal Gaming-Mode Bias into fair.c'
        shell: bash
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          set -euo pipefail
          FAIR_C="kernel/sched/fair.c"
          if ! grep -q "extern int sched_gaming_active;" "$FAIR_C"; then
            perl -0pi -e 's{(static unsigned int normalized_sysctl_sched_latency\s*=\s*6000000ULL;)}{$1\n\nextern int sched_gaming_active;\n\n#define GAMING_VRUNTIME_STRETCH\t\t4\n}' "$FAIR_C"
          fi
          if ! grep -q "GAMING_VRUNTIME_STRETCH - 1" "$FAIR_C"; then
            perl -0pi -e 's{(\tcurr->vruntime \+= calc_delta_fair\(delta_exec, curr\);\n)(\tupdate_min_vruntime\(cfs_rq\);\n)}{$1\n\tif (unlikely(sched_gaming_active \&\& !entity_is_task(curr))) {\n\t\tcurr->vruntime += calc_delta_fair(delta_exec * (GAMING_VRUNTIME_STRETCH - 1), curr);\n\t} else if (unlikely(sched_gaming_active \&\& entity_is_task(curr) \&\&\n\t\t\t     curr->avg.load_avg < 100)) {\n\t\tcurr->vruntime += calc_delta_fair(delta_exec, curr);\n\t}\n$2}' "$FAIR_C"
          fi
          if ! grep -q "ideal_runtime / 2" "$FAIR_C"; then
            perl -0pi -e 's{(\tdelta_exec = curr->sum_exec_runtime - curr->prev_sum_exec_runtime;\n)(\ttrace_android_rvh_check_preempt_tick)}{$1\n\tif (unlikely(sched_gaming_active) \&\& entity_is_task(curr)) {\n\t\tstruct task_struct *p = task_of(curr);\n\n\t\tif (p->static_prio > DEFAULT_PRIO \&\&\n\t\t    delta_exec > ideal_runtime / 2)\n\t\t\tresched_curr(rq_of(cfs_rq));\n\t}\n\n$2}' "$FAIR_C"
          fi
          if ! grep -q "NSEC_PER_MSEC" "$FAIR_C"; then
            perl -0pi -e 's{(\tfor_each_sched_entity\(se\) \{\n\t\tcfs_rq = cfs_rq_of\(se\);\n\n)(\t\tupdate_load_avg\(cfs_rq, se, UPDATE_TG\);\n\t\tse_update_runnable\(se\);\n\t\tupdate_cfs_group\(se\);)}{$1\t\tif (unlikely(sched_gaming_active \&\& entity_is_task(se) \&\&\n\t\t\t     task_of(se)->static_prio <= DEFAULT_PRIO))\n\t\t\tse->vruntime -= min_t(u64, se->vruntime, NSEC_PER_MSEC);\n\n$2}' "$FAIR_C"
          fi
          if ! grep -q "Gaming task isolation" "$FAIR_C"; then
            perl -0pi -e 's{(\tdelta = rq_clock_task\(env->src_rq\) - p->se\.exec_start;\n\n)(\treturn delta < \(s64\)sysctl_sched_migration_cost;\n\}\n)}{$1\t/* Gaming task isolation */\n\tif (sched_gaming_active) {\n\t\tif (capacity_orig_of(env->dst_cpu) < capacity_orig_of(env->src_cpu) \&\&\n\t\t    task_util(p) > (capacity_orig_of(env->src_cpu) >> 3))\n\t\t\treturn 1;\n\t\treturn delta < (s64)sysctl_sched_migration_cost * 2;\n\t}\n\n$2}' "$FAIR_C"
          fi
          for MARK in "extern int sched_gaming_active;" "GAMING_VRUNTIME_STRETCH - 1" "ideal_runtime / 2" "NSEC_PER_MSEC" "Gaming task isolation"; do
            if ! grep -qF "$MARK" "$FAIR_C"; then
              echo "ERROR: failed to inject fair.c gaming patch, missing marker: $MARK" >&2
              exit 1
            fi
          done

      - name: "🚀 Add Droidspaces Support (fix KABI sysvipc)"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          curl -sL "https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch" | git apply -v --ignore-whitespace || echo "::warning::Droidspaces patch skipped/failed"

      - name: "🔧 Add NoMount Support"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          curl -LSs "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh" | bash -

      - name: "📝 Append custom Makefile line"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
         echo 'KBUILD_CFLAGS += -Wno-implicit-function-declaration' >> Makefile

      - name: "🔨 Build kernel"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          LTO=full \
          BUILD_CONFIG=${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64 \
          build/build.sh -j$(nproc --all)

      - name: "📡 Build RTL8188EUS driver (TP-Link TL-WN722N V4)"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          set -e
          echo "🔧 Preparando kernel headers para compilar módulos externos..."
          cd ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
          make ARCH=arm64 LLVM=1 CC=clang AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy STRIP=llvm-strip modules_prepare || true
          make ARCH=arm64 LLVM=1 CC=clang AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy STRIP=llvm-strip modules_install INSTALL_MOD_PATH=../ || true

          cd ${{ env.WORK_DIR }}
          echo "📦 Clonando driver rtl8188eus..."
          git clone --depth=1 -b v5.3.9 https://github.com/aircrack-ng/rtl8188eus.git rtl8188eus-src || {
            echo "::warning::No se pudo clonar rtl8188eus"
            exit 0
          }

          cd rtl8188eus-src

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export KBUILD_KVER=$(cat ${{ env.WORK_DIR }}/${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/include/config/kernel.release 2>/dev/null || echo "5.15.0")

          echo "🔨 Compilando driver con KSRC apuntando al kernel compilado..."
          sed -i "s|^KSRC :=.*|KSRC := ${{ env.WORK_DIR }}/${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}|" Makefile

          make -j$(nproc) || {
            echo "::warning::Falló la compilación del driver RTL8188EUS (esperado en GKI sin cfg80211/mac80211)"
            exit 0
          }

          find . -name "8188eu.ko" -exec cp {} "${{ env.WORK_DIR }}/" \; 2>/dev/null || true
          if ls "${{ env.WORK_DIR }}"/*.ko 1>/dev/null 2>&1; then
            echo "✅ Driver RTL8188EUS compilado"
          else
            echo "::warning::No se generó 8188eu.ko"
          fi

      - name: "🔧 Build memtool (static)"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          set -e
          echo "📦 Cloning memtool..."
          git clone --depth=1 https://github.com/ensc/memtool.git memtool-src || \
            { echo "❌ Failed to clone memtool"; exit 1; }

          cd memtool-src

          echo "🔧 Generating configure script with autoreconf..."
          autoreconf -fi

          echo "⚙️ Configuring for static aarch64 build..."
          ./configure --host=aarch64-linux-gnu CC=aarch64-linux-gnu-gcc CFLAGS="-static -O2"

          echo "🔨 Building static memtool..."
          make

          if [ ! -f memtool ]; then
            echo "❌ memtool binary not found"
            exit 1
          fi

          file memtool
          cp memtool "${{ env.WORK_DIR }}/memtool"
          echo "✅ memtool built and copied to workspace"

      - name: "📁 Copy Vanilla kernel image"
        if: matrix.kernel.enable_ksu == false
        working-directory: ${{ env.WORK_DIR }}/out/dist
        run: |
          cp Image "${{ env.OUTPUT_NAME }}"

      - name: "📤 Upload kernel artifact"
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.kernel.name }}-kernel
          path: ${{ env.WORK_DIR }}/out/dist/${{ env.OUTPUT_NAME }}
          retention-days: 1

      - name: "📤 Upload memtool artifact"
        uses: actions/upload-artifact@v7
        with:
          name: memtool-${{ matrix.kernel.name }}
          path: ${{ env.WORK_DIR }}/memtool
          retention-days: 1

      - name: "📤 Upload driver artifacts (includes MemKernel .ko)"
        uses: actions/upload-artifact@v7
        with:
          name: drivers-${{ matrix.kernel.name }}
          path: ${{ env.WORK_DIR }}/*.ko
          retention-days: 1
          if-no-files-found: ignore

      - name: 🔍 Check Space (Post-Build)
        if: always()
        run: |
          echo "Final disk space status:"
          df -h /

  package-kernels:
    name: "📦 Package Kernels"
    runs-on: ubuntu-latest
    needs: [build-kernels]
    steps:
      - name: "📥 Download kernel artifacts"
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts/

      - name: "📦 Create release package"
        run: |
          set -e
          git clone --depth=1 https://github.com/yougotme101/AnyKernel3 -b YASK AnyKernel3
          find ./artifacts -name "Image.*" -exec cp {} AnyKernel3/ \;

          MEMTOOL_BIN=$(find ./artifacts -name "memtool" -type f | head -n 1)
          if [ -n "$MEMTOOL_BIN" ] && [ -f "$MEMTOOL_BIN" ]; then
            cp "$MEMTOOL_BIN" AnyKernel3/memtool
            chmod +x AnyKernel3/memtool
            echo "✅ memtool incluido en el ZIP"
          else
            echo "::warning::memtool no encontrado en los artefactos"
          fi

          DRIVERS=$(find ./artifacts -name "*.ko" -type f 2>/dev/null || true)
          if [ -n "$DRIVERS" ]; then
            echo "$DRIVERS" | while read ko; do
              cp "$ko" AnyKernel3/
              echo "✅ Driver incluido: $(basename $ko)"
            done
          else
            echo "::warning::No se encontraron drivers .ko"
          fi

          cat > AnyKernel3/banner << 'EOF'
