name: "Build XStock-NoKSU"

env:
  OUT_DIR: "out"
  KERNEL_VERSION: "5.15"
  ANDROID_VERSION: "13"

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernels:
    name: "🐎 Build XStock ${{ matrix.kernel.name }} kernel"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kernel:
          - name: "GKI-NoKSU"
            dir: "common_gki_noksu"
            repo_name: "common"
            repo_url: "https://android.googlesource.com/kernel/common"
            branch: "android13-5.15-lts"
            defconfig: "gki_defconfig"
            local_version: "-XStock-GKI"
            output_name: "Image.gki.noksu"
            enable_ksu: false
            extra_patches:
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-gki-fixup.patch"
              - "https://raw.githubusercontent.com/yougotme101/kernel_patches/main/0001-scripts-sign-builds.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-Don-t-append-and-dirty-to-localversion.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-do-not-ship-full-auto_localversion.patch"
          - name: "CLO-NoKSU"
            dir: "common_clo_noksu"
            repo_name: "clo"
            repo_url: "https://git.codelinaro.org/clo/la/kernel/msm-5.15.git"
            branch: "kernel.lnx.5.15.r1-rel"
            defconfig: "gki_defconfig"
            local_version: "-XStock-CLO"
            output_name: "Image.clo.noksu"
            enable_ksu: false
            extra_patches:
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-gki-fixup.patch"
              - "https://raw.githubusercontent.com/yougotme101/kernel_patches/main/0001-scripts-sign-builds.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-Don-t-append-and-dirty-to-localversion.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-do-not-ship-full-auto_localversion.patch"

    env:
      KERNEL_LOC_DIR: ${{ matrix.kernel.dir }}
      KERNEL_NAME: ${{ matrix.kernel.repo_name }}
      KERNEL_REPO: ${{ matrix.kernel.repo_url }}
      KERNEL_BRANCH: ${{ matrix.kernel.branch }}
      DEFCONFIG_NAME: ${{ matrix.kernel.defconfig }}
      LOCAL_VERSION: ${{ matrix.kernel.local_version }}
      OUTPUT_NAME: ${{ matrix.kernel.output_name }}
      WORK_DIR: ${{ github.workspace }}

    steps:
      - name: "✨ Setup workspace"
        run: |
          mkdir -p ${{ env.KERNEL_LOC_DIR }}
          echo "BUILD_TIME=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          sudo apt-get update -qq
          sudo apt-get install -y repo rsync aria2 jq

      - name: 🔍 Check Space (Before Cleanup)
        run: df -h /

      - name: 🧹 Aggressive Cleanup
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force
          sudo docker builder prune -a -f

      - name: 📐 Setup SWAP 14GB
        uses: pierotofy/set-swap-space@master
        with:
            swap-size-gb: 14

      - name: 📐 Tune Swap
        run: |
            echo "vm.swappiness=80" | sudo tee -a /etc/sysctl.conf
            sudo sysctl -p

      - name: "🌟 Clone kernel source"
        working-directory: ./${{ env.KERNEL_LOC_DIR }}
        run: |
          git clone --recursive --branch ${{ env.KERNEL_BRANCH }} \
            ${{ env.KERNEL_REPO }} ${{ env.KERNEL_NAME }} --depth=1

      - name: "📥 Initialize AOSP repo and toolchains"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15-lts --depth=1
          repo sync --optimized-fetch --prune -j8

          rm -rf .repo common

          aria2c -x 16 -s 16 -o prebuilts/clang/host/linux-x86/clang-r614150.tar.gz "https://github.com/yougotme101/clang/releases/download/v1.0.2/clang-r614150.tar.gz"
          mkdir -p prebuilts/clang/host/linux-x86/clang-r614150
          tar -xzf prebuilts/clang/host/linux-x86/clang-r614150.tar.gz -C prebuilts/clang/host/linux-x86/clang-r614150
          rm -rf prebuilts/clang/host/linux-x86/clang-r614150.tar.gz

          rm -rf prebuilts/clang/host/linux-x86/clang-3289846 \
                 prebuilts/clang/host/linux-x86/clang-r450784e \
                 prebuilts/clang/host/linux-x86/clang-r547379 \
                 prebuilts/clang/host/linux-x86/clang-r584948b \
                 prebuilts/clang/host/linux-x86/clang-r596125 \
                 prebuilts/clang/host/linux-x86/clang-stable

          sed -i \
           -e 's/^BRANCH=.*/BRANCH=android13-5.15/' \
           -e 's/^CLANG_VERSION=.*/CLANG_VERSION=r614150/' \
           ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.constants

          sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki || true

      - name: "🧩 Configure kernel & patches"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          echo "CONFIG_LOCALVERSION=\"${{ env.LOCAL_VERSION }}-${{ env.BUILD_TIME }}\"" >> "$CONFIG_FILE"
          echo "CONFIG_LOCALVERSION_AUTO=n" >> "$CONFIG_FILE"

          apply_patch() {
            local url="$1"
            local file=$(basename "$url")
            curl -L -o "$file" "$url"
            patch -p1 < "$file" || echo "::warning::Hunks failed in $file"
            rm -f "$file"
          }

          apply_patch "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-gki-fixup.patch"

          echo '${{ toJSON(matrix.kernel.extra_patches) }}' | jq -r '.[]' | while read p; do
            [ -n "$p" ] && apply_patch "$p"
          done

          echo "CONFIG_KALLSYMS=y" >> "$CONFIG_FILE"

          # Optimizaciones base
          echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" >> "$CONFIG_FILE"
          echo "CONFIG_TCP_CONG_ADVANCED=y" >> "$CONFIG_FILE"
          echo "CONFIG_TCP_CONG_BIC=n" >> "$CONFIG_FILE"
          echo "CONFIG_TCP_CONG_WESTWOOD=y" >> "$CONFIG_FILE"
          echo "CONFIG_TCP_CONG_HTCP=n" >> "$CONFIG_FILE"
          echo "CONFIG_TCP_CONG_BBR=y" >> "$CONFIG_FILE"
          echo "CONFIG_DEFAULT_BBR=y" >> "$CONFIG_FILE"
          echo "CONFIG_OVERLAY_FS=y" >> "$CONFIG_FILE"
          echo "CONFIG_TMPFS_XATTR=y" >> "$CONFIG_FILE"
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> "$CONFIG_FILE"
          echo "CONFIG_WQ_POWER_EFFICIENT_DEFAULT=y" >> "$CONFIG_FILE"
          echo "CONFIG_PM_WAKELOCKS=y" >> "$CONFIG_FILE"
          echo "CONFIG_PM_WAKELOCKS_LIMIT=100" >> "$CONFIG_FILE"
          echo "CONFIG_PM_WAKELOCKS_GC=y" >> "$CONFIG_FILE"
          echo "CONFIG_SUSPEND=y" >> "$CONFIG_FILE"
          echo "CONFIG_SUSPEND_FREEZER=y" >> "$CONFIG_FILE"
          echo "# CONFIG_KERNEL_GZIP is not set" >> "$CONFIG_FILE"
          echo "# CONFIG_KERNEL_LZO is not set" >> "$CONFIG_FILE"
          echo "# CONFIG_KERNEL_XZ is not set" >> "$CONFIG_FILE"
          echo "# CONFIG_KERNEL_ZSTD is not set" >> "$CONFIG_FILE"
          echo "# CONFIG_KERNEL_BZIP2 is not set" >> "$CONFIG_FILE"
          echo "# CONFIG_KERNEL_UNCOMPRESSED is not set" >> "$CONFIG_FILE"
          sed -i '/ZRAM_DEF_COMP_LZO/d' "$CONFIG_FILE"
          echo "CONFIG_CRYPTO_LZ4=y" >> "$CONFIG_FILE"
          echo "CONFIG_KERNEL_LZ4=y" >> "$CONFIG_FILE"
          echo "ZRAM_DEF_COMP_LZ4=y" >> "$CONFIG_FILE"

          # memtool support
          echo "CONFIG_DEVMEM=y" >> "$CONFIG_FILE"

          # ===== mt7921u (soporte para adaptadores USB WiFi MediaTek) =====
          echo "CONFIG_MT76_CORE=m" >> "$CONFIG_FILE"
          echo "CONFIG_MT76_USB=m" >> "$CONFIG_FILE"
          echo "CONFIG_MT7921_COMMON=m" >> "$CONFIG_FILE"
          echo "CONFIG_MT7921U=m" >> "$CONFIG_FILE"

          # Agregar mt7921u y dependencias a la lista de módulos GKI
          # Nota: esto solo funciona si la lista original no contiene mt7921u
          MODULES_LIST="android/gki_aarch64_modules"
          for mod in "mt76.ko" "mt76-usb.ko" "mt7921-common.ko" "mt7921u.ko"; do
            if ! grep -q "$mod" "$MODULES_LIST"; then
              echo "drivers/net/wireless/mediatek/mt76/$mod" >> "$MODULES_LIST"
            fi
          done

          # Agregar ID USB de TP-Link TXE50UH al driver mt7921u (si no existe)
          MT7921U_USB="drivers/net/wireless/mediatek/mt76/mt7921/usb.c"
          if [ -f "$MT7921U_USB" ] && ! grep -q "0x35bc" "$MT7921U_USB"; then
            sed -i '/static const struct usb_device_id mt7921u_device_table\[\] = {/a\
            \t/* TP-Link TXE50UH */\
            \t{ USB_DEVICE_AND_INTERFACE_INFO(0x35bc, 0x0107, 0xff, 0xff, 0xff), },' "$MT7921U_USB"
          fi

      # ... (mantener los pasos Inject Reflex/Vorpal/Droidspaces/NoMount existentes sin cambios) ...
      # Por brevedad no se repiten aquí, copia los pasos originales de tu workflow

      - name: "📝 Append custom Makefile line"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
         echo 'KBUILD_CFLAGS += -Wno-implicit-function-declaration' >> Makefile

      - name: "🔨 Build kernel"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          LTO=full \
          BUILD_CONFIG=${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64 \
          build/build.sh -j$(nproc --all)

      - name: "📁 Copy Vanilla kernel image"
        if: matrix.kernel.enable_ksu == false
        working-directory: ${{ env.WORK_DIR }}/out/dist
        run: |
          cp Image "${{ env.OUTPUT_NAME }}"

      - name: "📤 Upload kernel artifact"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.kernel.name }}-kernel
          path: ${{ env.WORK_DIR }}/out/dist/${{ env.OUTPUT_NAME }}
          retention-days: 1

  package-kernels:
    name: "📦 Package Kernels"
    runs-on: ubuntu-latest
    needs: [build-kernels]
    steps:
      - name: "📥 Download kernel artifacts"
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts/

      - name: "📦 Create release package"
        run: |
          set -e
          git clone --depth=1 https://github.com/yougotme101/AnyKernel3 -b YASK AnyKernel3
          find ./artifacts -name "Image.*" -exec cp {} AnyKernel3/ \;

          # Intentar incluir módulos mt7921u si existen
          mkdir -p AnyKernel3/modules
          find ${{ env.WORK_DIR }}/out -name "mt7921u.ko" -exec cp {} AnyKernel3/modules/ \; 2>/dev/null || true
          find ${{ env.WORK_DIR }}/out -name "mt7921-common.ko" -exec cp {} AnyKernel3/modules/ \; 2>/dev/null || true
          find ${{ env.WORK_DIR }}/out -name "mt76-usb.ko" -exec cp {} AnyKernel3/modules/ \; 2>/dev/null || true
          find ${{ env.WORK_DIR }}/out -name "mt76.ko" -exec cp {} AnyKernel3/modules/ \; 2>/dev/null || true

          ZIP_NAME="AK3_XStock-AIO-FULL_NOKSU_$(date +'%Y-%m-%d').zip"
          cd AnyKernel3
          zip -r9 "../$ZIP_NAME" * -x .git/*
          cd ..
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: "⬆️ Upload to GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          tag_name: "XStock-NoKSU"
          generate_release_notes: true
